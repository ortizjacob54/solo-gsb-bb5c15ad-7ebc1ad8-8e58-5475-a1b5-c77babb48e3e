services:
  greenwave-api:
    build: .
    image: greenwave-api:latest
    container_name: greenwave-api
    ports:
      # 宿主机端口可用环境变量 PORT 覆盖，默认 8000
      - "${PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
